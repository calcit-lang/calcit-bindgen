[package]
name = "calcit-bindgen"
version = "0.1.0"
edition = "2024"
description = "Deterministic typed binding generator for Calcit FFI Interface IR"
license = "MIT"
repository = "https://github.com/calcit-lang/calcit-bindgen"
readme = "README.md"
keywords = ["calcit", "ffi", "bindgen", "wit"]
categories = ["development-tools::ffi", "command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
calcit_native_ffi = "0.1.3"
cirru_edn = "0.8.0"
libloading = "0.8"
md5 = "0.7"
