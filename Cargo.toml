[package]
name = "calcit-bindgen"
version = "0.1.1"
edition = "2024"
description = "Deterministic typed binding generator for Calcit FFI Interface IR"
license = "MIT"
repository = "https://github.com/calcit-lang/calcit-bindgen"
readme = "README.md"
keywords = ["calcit", "ffi", "bindgen", "wit"]
categories = ["development-tools::ffi", "command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
cirru_edn = "0.8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
md5 = "0.7"
wasmparser = "0.258"
wit-component = "0.258"
wit-parser = "0.258"

[dev-dependencies]
calcit_native_ffi = "0.1.3"
libloading = "0.8"
wat = "1.258"
wasmtime = { version = "38.0.3", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
