name: Check

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Build Component fixture for jco
        if: matrix.os == 'ubuntu-latest'
        run: CALCIT_BINDGEN_COMPONENT_OUTPUT="$RUNNER_TEMP/calcit-component.wasm" cargo test --test component_package packages_checks_and_runs_number_and_string_component
      - name: Transpile and run Component with jco
        if: matrix.os == 'ubuntu-latest'
        run: |
          npx --yes @bytecodealliance/jco@1.16.1 transpile "$RUNNER_TEMP/calcit-component.wasm" --out-dir "$RUNNER_TEMP/jco" --name component --instantiation async --no-typescript
          echo '{"type":"module"}' > "$RUNNER_TEMP/jco/package.json"
          node tests/jco-smoke.mjs "$RUNNER_TEMP/jco/component.js"
      - run: cargo package

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
