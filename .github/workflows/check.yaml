name: Check

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Run WASI 0.3.1 command Component with Wasmtime 49.0.0
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl --fail --location --silent --show-error \
            'https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.0/wasmtime-v49.0.0-x86_64-linux.tar.xz' \
            --output "$RUNNER_TEMP/wasmtime-v49.0.0-x86_64-linux.tar.xz"
          echo "a956c279ac6e80109369a285db30fc46f68239fa1bbeb03ccfa8e913bbca85fc  $RUNNER_TEMP/wasmtime-v49.0.0-x86_64-linux.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/wasmtime-v49.0.0-x86_64-linux.tar.xz" -C "$RUNNER_TEMP"
          WASMTIME_49_CLI="$RUNNER_TEMP/wasmtime-v49.0.0-x86_64-linux/wasmtime" \
            cargo test --test wasi_command
      - name: Check out the matching Calcit release
        if: matrix.os == 'ubuntu-latest'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: calcit-lang/calcit
          ref: 0.18.0
          path: calcit-core
          persist-credentials: false
      - name: Generate and run a real Calcit numeric Component
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --manifest-path calcit-core/Cargo.toml --bin calcit
          calcit-core/target/debug/calcit calcit-core/tests/fixtures/component-wasm.cirru ffi export --boundary component > "$RUNNER_TEMP/component-interface.cirru"
          calcit-core/target/debug/calcit calcit-core/tests/fixtures/component-wasm.cirru wasm --boundary component --emit-path "$RUNNER_TEMP/component-core"
          CALCIT_BINDGEN_REAL_CONTRACT="$RUNNER_TEMP/component-interface.cirru" \
            CALCIT_BINDGEN_REAL_CORE="$RUNNER_TEMP/component-core/program.wasm" \
            CALCIT_BINDGEN_COMPONENT_OUTPUT="$RUNNER_TEMP/calcit-component.wasm" \
            cargo test --test component_package packages_and_runs_real_calcit_enum_component -- --ignored --exact
      - name: Transpile and run Component with jco
        if: matrix.os == 'ubuntu-latest'
        run: |
          npx --yes @bytecodealliance/jco@1.16.1 transpile "$RUNNER_TEMP/calcit-component.wasm" --out-dir "$RUNNER_TEMP/jco" --name component --instantiation async --no-typescript
          echo '{"type":"module"}' > "$RUNNER_TEMP/jco/package.json"
          node tests/jco-smoke.mjs "$RUNNER_TEMP/jco/component.js"
      - name: Verify Calcit core lifecycle semantics
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo test --manifest-path calcit-core/Cargo.toml --test component_wasm_cli async_component_import_waits_for_subtask_and_drops_lifecycle_handles -- --exact
          cargo test --manifest-path calcit-core/Cargo.toml --test component_wasm_cli scoped_stream_export_bounds_reads_and_closes_every_terminal_path -- --exact
          cargo test --manifest-path calcit-core/Cargo.toml --test component_wasm_cli packaged_component_invokes_sync_post_return_in_wasmtime -- --exact
      - name: Package the real Calcit lifecycle surface
        if: matrix.os == 'ubuntu-latest'
        run: |
          for fixture in component-wasm-async-export component-wasm-async-import component-wasm-stream; do
            calcit-core/target/debug/calcit "calcit-core/tests/fixtures/$fixture.cirru" ffi export --boundary component > "$RUNNER_TEMP/$fixture-interface.cirru"
            calcit-core/target/debug/calcit "calcit-core/tests/fixtures/$fixture.cirru" wasm --boundary component --emit-path "$RUNNER_TEMP/$fixture-core"
          done
          CALCIT_BINDGEN_ASYNC_EXPORT_CONTRACT="$RUNNER_TEMP/component-wasm-async-export-interface.cirru" \
            CALCIT_BINDGEN_ASYNC_EXPORT_CORE="$RUNNER_TEMP/component-wasm-async-export-core/program.wasm" \
            CALCIT_BINDGEN_ASYNC_IMPORT_CONTRACT="$RUNNER_TEMP/component-wasm-async-import-interface.cirru" \
            CALCIT_BINDGEN_ASYNC_IMPORT_CORE="$RUNNER_TEMP/component-wasm-async-import-core/program.wasm" \
            CALCIT_BINDGEN_STREAM_CONTRACT="$RUNNER_TEMP/component-wasm-stream-interface.cirru" \
            CALCIT_BINDGEN_STREAM_CORE="$RUNNER_TEMP/component-wasm-stream-core/program.wasm" \
            cargo test --test async_component packages_real_calcit_stackless_lifecycle_surface -- --ignored --exact
      - name: Drive the real Calcit HTTP export from Cirru EDN
        if: matrix.os == 'ubuntu-latest'
        run: |
          calcit-core/target/debug/calcit calcit-core/examples/wasi-http-client/calcit.cirru ffi export --boundary component > "$RUNNER_TEMP/wasi-http-interface.cirru"
          calcit-core/target/debug/calcit calcit-core/examples/wasi-http-client/calcit.cirru wasm --boundary component --emit-path "$RUNNER_TEMP/wasi-http-core"
          cargo run -- generate "$RUNNER_TEMP/wasi-http-interface.cirru" \
            --core-module "$RUNNER_TEMP/wasi-http-core/program.wasm" \
            --out "$RUNNER_TEMP/wasi-http-package"
          cargo test --features wasmtime-http
          CALCIT_BINDGEN_REAL_HTTP_COMPONENT="$RUNNER_TEMP/wasi-http-package/component/component.wasm" \
            cargo test --features wasmtime-http --test wasmtime_host_values \
              drives_real_calcit_http_success_denial_and_limit_results -- --ignored --exact
      - run: cargo package

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
